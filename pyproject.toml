[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allfinder"
version = "0.1.0"
description = "All subdomain finders in one place: passive + active enumeration from the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx[http2]>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "dnspython>=2.6",
    "aiodns>=3.1",
    "psutil>=5.9",
]

[project.scripts]
allfinder = "allfinder.cli.main:app"

[project.entry-points."allfinder.plugins"]
# third-party packages can register plugins here: name = "pkg.module:PluginClass"

[tool.hatch.build.targets.wheel]
packages = ["allfinder"]
