[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allfinder"
version = "0.1.0"
description = "All subdomain finders in one place: passive + active enumeration from the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx[http2]>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "dnspython>=2.6",
    "aiodns>=3.1",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    # linters are pinned so CI (and contributors) use the same version and
    # formatting/typing results do not drift when a new release lands.
    "ruff==0.17.2",
    "mypy==2.4.0",
    "types-PyYAML",
]

[project.scripts]
allfinder = "allfinder.cli.main:app"

[project.entry-points."allfinder.plugins"]
# third-party packages can register plugins here: name = "pkg.module:PluginClass"

[tool.hatch.build.targets.wheel]
packages = ["allfinder"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC109", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"allfinder/cli/main.py" = ["E501"]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: talks to real network services (opt-in with -m live)"]
addopts = "-m 'not live'"
